<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Idea Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="relative isolate min-h-screen overflow-hidden">
      <div class="pointer-events-none absolute -left-24 top-0 h-80 w-80 rounded-full bg-cyan-500/20 blur-3xl"></div>
      <div class="pointer-events-none absolute -right-20 bottom-0 h-96 w-96 rounded-full bg-emerald-500/20 blur-3xl"></div>

      <main class="mx-auto max-w-4xl px-4 py-14 sm:px-6 lg:px-8">
        <section class="rounded-2xl border border-slate-800/70 bg-slate-900/70 p-6 shadow-2xl backdrop-blur sm:p-8">
          <div class="mb-8">
            <p class="inline-flex items-center rounded-full border border-cyan-400/40 bg-cyan-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-cyan-200">
              Hackathon MVP
            </p>
            <h1 class="mt-4 text-3xl font-black tracking-tight sm:text-4xl">AI Idea Validator</h1>
            <p class="mt-3 max-w-2xl text-slate-300">
              Paste your startup or project concept. Get a one-line value proposition, 3 aligned SDGs, and a complexity score from Gemini.
            </p>
          </div>

          <form id="idea-form" class="space-y-4">
            <label for="idea" class="block text-sm font-semibold text-slate-200">Your Project Idea</label>
            <textarea
              id="idea"
              name="idea"
              rows="6"
              placeholder="Example: A low-cost telemedicine kiosk network for rural clinics with multilingual AI symptom intake..."
              class="w-full rounded-xl border border-slate-700 bg-slate-950/60 px-4 py-3 text-slate-100 placeholder-slate-500 shadow-inner outline-none ring-cyan-400/30 transition focus:border-cyan-400 focus:ring"
              required
            ></textarea>
            <button
              id="submit-btn"
              type="submit"
              class="inline-flex items-center rounded-xl bg-cyan-500 px-5 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-300 disabled:cursor-not-allowed disabled:opacity-60"
            >
              Validate
            </button>
          </form>

          <div id="status" class="mt-5 text-sm text-slate-300" aria-live="polite"></div>

          <section id="result" class="mt-8 hidden space-y-5 rounded-xl border border-slate-800 bg-slate-950/40 p-5">
            <div>
              <h2 class="text-xs font-bold uppercase tracking-widest text-cyan-200">Value Proposition</h2>
              <p id="value-prop" class="mt-2 text-slate-100"></p>
            </div>

            <div>
              <h2 class="text-xs font-bold uppercase tracking-widest text-cyan-200">Target SDGs</h2>
              <ul id="sdg-list" class="mt-2 list-disc space-y-1 pl-5 text-slate-100"></ul>
            </div>

            <div>
              <h2 class="text-xs font-bold uppercase tracking-widest text-cyan-200">Complexity Score</h2>
              <p id="complexity" class="mt-2 text-2xl font-extrabold text-emerald-300"></p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
      const form = document.getElementById("idea-form");
      const ideaInput = document.getElementById("idea");
      const submitBtn = document.getElementById("submit-btn");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const valuePropEl = document.getElementById("value-prop");
      const sdgListEl = document.getElementById("sdg-list");
      const complexityEl = document.getElementById("complexity");

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? "Validating..." : "Validate";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const idea = ideaInput.value.trim();
        if (!idea) {
          statusEl.textContent = "Please enter a project idea first.";
          return;
        }

        setLoading(true);
        statusEl.textContent = "Asking Gemini to evaluate your idea...";
        resultEl.classList.add("hidden");

        try {
          const response = await fetch("/api/validate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idea }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Validation failed.");
          }

          valuePropEl.textContent = data.valueProposition;
          sdgListEl.innerHTML = "";
          data.sdgs.forEach((sdg) => {
            const li = document.createElement("li");
            li.textContent = sdg;
            sdgListEl.appendChild(li);
          });
          complexityEl.textContent = `${data.complexityScore}/10`;

          statusEl.textContent = data.note || "Validation complete.";
          resultEl.classList.remove("hidden");
        } catch (error) {
          statusEl.textContent = error.message || "Something went wrong.";
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
